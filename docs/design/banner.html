<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Banner: Halftime Show</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
</style>
</head>
<body>
<div style="width: 1200px; height: 400px; position: relative; overflow: hidden; background: #0B0B0B; color: #F2F2EE; font-family: 'Geist', system-ui, sans-serif">
  <div style="position: absolute; left: 48px; top: 36px; font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: #8F8F8A">danfirsten / halftime-show</div>
  <div style="position: absolute; left: 44px; top: 112px; display: flex; flex-direction: column; gap: 22px; width: 620px">
    <h1 style="margin: 0; font-size: 96px; font-weight: 500; letter-spacing: -0.06em; line-height: 0.9; white-space: nowrap">Halftime Show</h1>
    <p style="margin: 0 0 0 4px; font-size: 20px; line-height: 1.45; letter-spacing: -0.012em; color: #B4B4AF">Mutes the ad break and puts something better on top.</p>
  </div>
  <div style="position: absolute; left: 48px; bottom: 36px; font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: #8F8F8A">Chrome and Firefox · Manifest V3 · mute and cover, never skip · MIT</div>

  <svg viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Hoop sits on a sofa at night watching a small ink game on the TV; the TV's sound waves are cut off, muted" style="position: absolute; right: 0; top: 0">
    <defs>
      <clipPath id="cut"><rect x="372" y="0" width="268" height="400"></rect></clipPath>
    </defs>
    <!-- moon -->
    <path d="M598,44 A13,13 0 1,1 598,70" fill="none" stroke="#F2F2EE" stroke-width="1.4"></path>
    <path d="M598,44 A13,13 0 0,0 598,70 Z" fill="#F2F2EE"></path>

    <!-- floor -->
    <line x1="80" y1="332" x2="640" y2="332" stroke="#8F8F8A" stroke-width="1"></line>

    <!-- TV on a low stand -->
    <rect x="430" y="132" width="180" height="114" rx="8" fill="#0B0B0B" stroke="#F2F2EE" stroke-width="1.4"></rect>
    <rect x="440" y="142" width="160" height="94" rx="3" fill="#161616" stroke="#262626" stroke-width="1"></rect>
    <line x1="520" y1="246" x2="520" y2="262" stroke="#F2F2EE" stroke-width="1.4"></line>
    <rect x="462" y="262" width="116" height="40" rx="4" fill="#0B0B0B" stroke="#F2F2EE" stroke-width="1.4"></rect>
    <line x1="474" y1="302" x2="474" y2="332" stroke="#F2F2EE" stroke-width="1.4"></line>
    <line x1="566" y1="302" x2="566" y2="332" stroke="#F2F2EE" stroke-width="1.4"></line>

    <!-- the ink game on screen: dots falling, a small ring catching them -->
    <g fill="#F2F2EE">
      <circle cx="476" cy="160" r="2.4" opacity="0.5"></circle>
      <circle cx="512" cy="178" r="2.4" opacity="0.75"></circle>
      <circle cx="558" cy="166" r="2.4" opacity="0.6"></circle>
      <circle cx="534" cy="200" r="2.4"></circle>
      <circle cx="580" cy="190" r="2.4" opacity="0.7"></circle>
    </g>
    <g transform="translate(534,220) scale(0.42)">
      <path fill="none" stroke="#F2F2EE" stroke-width="2.6" d="M0,-14C8.2,-14 14.5,-8 14.5,1C14.5,9.2 8,13.6 0,13.6C-8,13.6 -14.5,9.2 -14.5,1C-14.5,-8 -8.2,-14 0,-14Z"></path>
    </g>
    <line x1="448" y1="230" x2="592" y2="230" stroke="#262626" stroke-width="1"></line>
    <text x="592" y="156" text-anchor="end" font-family="Geist Mono, monospace" font-size="9" fill="#8F8F8A">23</text>

    <!-- sound waves from the TV, cut off -->
    <g clip-path="url(#cut)" fill="none" stroke="#F2F2EE" stroke-width="1.4" stroke-linecap="round">
      <path d="M418,170 Q404,189 418,208"></path>
      <path d="M404,158 Q384,189 404,220"></path>
      <path d="M390,146 Q362,189 390,232"></path>
      <path d="M376,134 Q340,189 376,244"></path>
    </g>
    <line x1="372" y1="128" x2="372" y2="250" stroke="#8F8F8A" stroke-width="1"></line>
    <text x="378" y="266" font-family="Geist Mono, monospace" font-size="10" fill="#8F8F8A">muted</text>

    <!-- sofa -->
    <g fill="#0B0B0B" stroke="#F2F2EE" stroke-width="1.4" stroke-linejoin="round">
      <rect x="150" y="214" width="190" height="78" rx="18"></rect>
      <rect x="156" y="270" width="178" height="34" rx="8"></rect>
      <rect x="134" y="250" width="34" height="66" rx="14"></rect>
      <rect x="322" y="250" width="34" height="66" rx="14"></rect>
    </g>
    <line x1="150" y1="316" x2="150" y2="332" stroke="#F2F2EE" stroke-width="1.4"></line>
    <line x1="340" y1="316" x2="340" y2="332" stroke="#F2F2EE" stroke-width="1.4"></line>

    <!-- Hoop on the sofa, eyes on the TV -->
    <g transform="translate(250,248) scale(1.7)">
      <path fill="#0B0B0B" stroke="#F2F2EE" stroke-width="1.6" d="M0,-14C8.2,-14 14.5,-8 14.5,1C14.5,9.2 8,13.6 0,13.6C-8,13.6 -14.5,9.2 -14.5,1C-14.5,-8 -8.2,-14 0,-14Z"></path>
      <ellipse cx="-2.4" cy="-2.6" rx="1.6" ry="2.9" fill="#F2F2EE"></ellipse><ellipse cx="7.4" cy="-2.6" rx="1.6" ry="2.9" fill="#F2F2EE"></ellipse>
    </g>
  </svg>
</div>
</body>
</html>
